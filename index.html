<style>
:root{
  --bg:#f2f4f8;--surface:#fff;--ink:#101828;--muted:#566074;--line:#d9deea;
  --accent:#3548ff;--accent-ink:#fff;--ok:#12a150;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--surface:#141c2e;--ink:#e8ecf5;--muted:#9aa6bd;--line:#26314a;--accent:#8794ff;--accent-ink:#0c1220;--ok:#43d17f}}
:root[data-theme="dark"]{--bg:#0c1220;--surface:#141c2e;--ink:#e8ecf5;--muted:#9aa6bd;--line:#26314a;--accent:#8794ff;--accent-ink:#0c1220;--ok:#43d17f}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--body);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;margin-bottom:2rem}
section{padding:clamp(3.5rem,8vw,6rem) 0}
.muted{color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:60px}
.logo{font:800 1.15rem var(--head);text-decoration:none}
nav{display:flex;gap:.25rem;align-items:center;overflow-x:auto;scrollbar-width:none}
nav a{font-size:.95rem;font-weight:500;text-decoration:none;padding:.4rem .7rem;border-radius:8px;color:var(--muted);white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--surface)}
#theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;flex:none}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center;padding-top:clamp(3rem,8vw,6rem)}
.hero h1{font-size:clamp(2.4rem,6.2vw,4.4rem);font-weight:800}
.hero p{max-width:34em;margin:1.4rem 0 2rem;color:var(--muted);font-size:1.15rem}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{display:inline-block;padding:.8rem 1.3rem;border-radius:10px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);transition:transform .15s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-2px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font:400 .88rem/1.75 var(--mono);overflow:hidden;box-shadow:0 18px 40px -22px color-mix(in srgb,var(--accent) 55%,transparent)}
.panel .bar{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);font-size:.8rem}
.panel .bar b{color:var(--ok);font-weight:500}
.panel pre{padding:1rem 1.1rem;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.k{color:var(--accent)}
.panel .l{opacity:0;animation:in .4s forwards}
@keyframes in{to{opacity:1}}

/* experience */
.tl{list-style:none;padding:0;border-left:2px solid var(--line);margin-left:.4rem}
.tl li{position:relative;padding:0 0 2.2rem 1.6rem}
.tl li::before{content:"";position:absolute;left:-7px;top:.55rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl li.now::before{background:var(--ok);border-color:var(--ok)}
.tl h3{font-size:1.25rem;font-weight:700}
.tl .when{font-size:.9rem;color:var(--muted);margin:.2rem 0 .6rem}
.tl p{max-width:62ch}

/* projects */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;display:flex;flex-direction:column;gap:.8rem;grid-column:span 2}
.card.big{grid-column:span 6;padding:2rem}
.card h3{font-size:1.35rem;font-weight:700}
.card.big h3{font-size:1.8rem}
.card ul{padding-left:1.1rem;color:var(--muted)}
.card li{margin:.25rem 0}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}
.tags span{font:500 .78rem var(--mono);border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;color:var(--muted)}
.links{display:flex;gap:1.2rem;font-weight:600}
.links a{color:var(--accent)}
.more{margin-top:1.5rem;color:var(--muted)}
.win{align-self:flex-start;font:600 .85rem var(--body);background:var(--accent);color:var(--accent-ink);padding:.25rem .7rem;border-radius:999px}
.card.big.award{border:2px solid var(--accent)}

.shot{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:var(--line)}
.me{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:1.2rem}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-top:2rem}
.cert{display:flex;flex-direction:column;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem;text-decoration:none}
.cert:hover{border-color:var(--accent)}
.cert img,.cert .ph{width:100%;aspect-ratio:3/2;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line)}
.cert img.badge{object-fit:contain;background:#fff;padding:.5rem}
.cert .ph{display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 1.6rem var(--head);border:0}
.cert b{font:700 1rem/1.3 var(--head);margin-top:.3rem}
.cert small{color:var(--muted)}
/* skills */
dl{display:grid;grid-template-columns:11rem 1fr;gap:1rem 2rem;border-top:1px solid var(--line);padding-top:1.4rem}
dt{font:700 1rem var(--head)}
dd{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.two h3{font-size:1.2rem;margin-bottom:1rem}
.two ul{list-style:none;padding:0;display:grid;gap:1rem}
.two li small{display:block;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:3.5rem 0 2.5rem}
footer h2{font-size:clamp(2rem,6vw,3.4rem);margin-bottom:1.2rem}
footer .mail{font:700 clamp(1.1rem,3.6vw,1.8rem) var(--head);color:var(--accent);overflow-wrap:anywhere}
.social{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;margin:1.6rem 0 2.4rem;font-weight:600}
small.copy{color:var(--muted)}

@media(max-width:820px){
  .hero,.two{grid-template-columns:1fr;gap:2rem}
  .card{grid-column:span 6}
  dl{grid-template-columns:1fr;gap:.2rem}
  dd{margin-bottom:.9rem}
  .logo{display:none}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.panel .l{opacity:1;animation:none}.btn{transition:none}}

#adm details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:.2rem .9rem;margin:.6rem 0}

#adm .btn{padding:.5rem .9rem;font:inherit;font-weight:600;font-size:.9rem;background:transparent;color:var(--ink);cursor:pointer}
#adm .btn.primary{background:var(--accent);color:var(--accent-ink)}

#adg{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:1.2rem}
#adg[hidden]{display:none}
#adg .gbox{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.5rem}
#adg label{display:block;font-size:.85rem;font-weight:600;margin:.8rem 0 .25rem}
#adg input{width:100%;font:inherit;font-size:.95rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#adg .row{display:flex;gap:.6rem}
#adg .btn{padding:.5rem .9rem;font:inherit;font-weight:600;font-size:.9rem;background:transparent;color:var(--ink);cursor:pointer}
#adg .btn.primary{background:var(--accent);color:var(--accent-ink)}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline;padding:0}
#adm summary{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;list-style:none}
#adm summary::-webkit-details-marker{display:none}
#adm summary::before{content:"▸";transition:transform .15s}
#adm details[open]>summary::before{transform:rotate(90deg)}
#adm summary .st{flex:1;min-width:8rem}
#adm .btn.sq{padding:.3rem .65rem}
#adm .btn.dl{padding:.3rem .75rem;color:#d92d20;border-color:#d92d20}
#adm .btn:disabled{opacity:.4;cursor:default}
